name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    name: Tests and dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Fail on High or Critical dependency vulnerabilities
        run: npm audit --audit-level=high

  package:
    name: Package ${{ matrix.label }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-2025
            args: --win nsis portable --x64
          - label: Linux x64
            runner: ubuntu-24.04
            args: --linux AppImage --x64
          - label: macOS arm64
            runner: macos-15
            args: --mac dmg --arm64
          - label: macOS x64
            runner: macos-15-intel
            args: --mac dmg --x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node ./node_modules/electron-builder/cli.js ${{ matrix.args }} --publish=never
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: xcd-release-${{ matrix.label }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, package]
    runs-on: ubuntu-24.04
    environment: public-release
    permissions:
      contents: write
    env:
      XCD_RELEASE_APPROVED: ${{ vars.XCD_RELEASE_APPROVED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12
      - name: Require resolved legal and provenance gates
        shell: bash
        run: |
          set -euo pipefail
          test "$XCD_RELEASE_APPROVED" = "true" || { echo "Set the repository variable XCD_RELEASE_APPROVED=true only after release review." >&2; exit 1; }
          test -s LICENSE || { echo "A reviewed project LICENSE is required." >&2; exit 1; }
          test -s THIRD_PARTY_NOTICES.md || { echo "Reviewed third-party notices are required." >&2; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          test -s "docs/release-notes/${version}.md" || { echo "Bilingual release notes for ${version} are required." >&2; exit 1; }
          node -e 'const version = require("./package.json").version; const tag = process.env.GITHUB_REF_NAME; if (`v${version}` !== tag) { console.error(`Tag ${tag} does not match package version ${version}`); process.exit(1); }'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: xcd-release-*
          path: release-artifacts
          merge-multiple: true
      - run: node scripts/create-checksums.js release-artifacts
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/* --title "XCD SSH Client $GITHUB_REF_NAME" --notes-file "docs/release-notes/${GITHUB_REF_NAME#v}.md"
